name: Build LidarScanner

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "Available Xcode versions:"
          ls /Applications | grep Xcode
          sudo xcode-select -s /Applications/Xcode_16.1.app || true
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: |
          brew install xcodegen || true

      - name: Generate Xcode Project
        run: |
          xcodegen generate --project . --use-cache
          echo "Project generated successfully"

      - name: Build for iOS (unsigned)
        run: |
          xcodebuild build \
            -project LidarScanner.xcodeproj \
            -scheme LidarScanner \
            -configuration Release \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            OTHER_CODE_SIGN_FLAGS="--deep"

      - name: Run Tests
        run: |
          xcodebuild test \
            -project LidarScanner.xcodeproj \
            -scheme LidarScanner \
            -derivedDataPath build \
            -destination 'platform=iOS Simulator,OS=latest' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: LidarScanner-iOS
          path: build/Build/Products/Release-iphoneos/LidarScanner.app
          compression-level: 9

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/Build/Products/*.xcresult
          compression-level: 9

  lint:
    name: SwiftLint
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint || true

      - name: Run SwiftLint
        run: swiftlint --strict || true
