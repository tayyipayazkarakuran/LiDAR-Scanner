name: LidarScanner
options:
  bundleIdPrefix: com.lidarscanner
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.1"

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_FILE: LidarScanner/Info.plist
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO

targets:
  LidarScanner:
    type: application
    platform: iOS
    sources:
      - path: LidarScanner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lidarscanner.app
        INFOPLIST_FILE: LidarScanner/Info.plist
        GENERATE_INFOPLIST_FILE: NO
    dependencies: []

  LidarScannerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LidarScannerTests
    dependencies:
      - target: LidarScanner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lidarscanner.tests
        GENERATE_INFOPLIST_FILE: YES

  LidarScannerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LidarScannerUITests
    dependencies:
      - target: LidarScanner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lidarscanner.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  LidarScanner:
    build:
      targets:
        LidarScanner: all
    test:
      targets:
        - LidarScannerTests
        - LidarScannerUITests
